<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión del Millón</title><style>body{font-family:Arial;background:#eef7ff;text-align:center;padding:20px;color:#17324d}main{max-width:760px;margin:auto;background:white;padding:28px;border-radius:24px}h1{font-size:2.2rem}.stats{display:flex;justify-content:space-around;font-weight:bold;margin:20px}#q{font-size:1.6rem;font-weight:bold;margin:25px}button{display:block;width:100%;margin:12px 0;padding:16px;border:0;border-radius:14px;font-size:1.05rem;cursor:pointer}.answer{background:#e9f3ff}#msg{font-size:1.25rem;font-weight:bold;min-height:40px}.hidden{display:none}</style></head><body><main><h1>🚀 Misión del Millón</h1><p>Lee con atención y elige la respuesta correcta.</p><div class="stats"><span>⭐ <b id="score">0</b>/10</span><span>Reto <b id="level">1</b>/10</span></div><div id="q"></div><div id="answers"></div><div id="msg"></div><button id="restart" class="hidden">🔄 Jugar otra vez</button></main><script>
const qs=[["428 705","cuatrocientos veintiocho mil setecientos cinco","cuatrocientos ochenta y dos mil setecientos cinco","cuatrocientos veintiocho mil setenta y cinco"],["trescientos cinco mil dieciocho","305 018","350 018","305 180"],["760 240","setecientos sesenta mil doscientos cuarenta","setecientos seis mil doscientos cuarenta","setecientos sesenta mil veinticuatro"],["novecientos noventa y nueve mil novecientos noventa y nueve","999 999","990 999","999 099"],["501 006","quinientos un mil seis","quinientos diez mil seis","quinientos un mil sesenta"],["ochocientos cuarenta mil trescientos cincuenta","840 350","804 350","840 305"],["246 708","doscientos cuarenta y seis mil setecientos ocho","doscientos sesenta y cuatro mil setecientos ocho","doscientos cuarenta y seis mil setenta y ocho"],["setecientos dos mil once","702 011","720 011","702 110"],["580 320","quinientos ochenta mil trescientos veinte","quinientos ocho mil trescientos veinte","quinientos ochenta mil treinta y dos"],["novecientos trece mil cuarenta y cinco","913 045","931 045","913 450"]];
let i=0,s=0;function sh(a){return a.sort(()=>Math.random()-.5)}function show(){level.textContent=i+1;q.textContent=qs[i][0];answers.innerHTML="";sh(qs[i].slice(1)).forEach(a=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>pick(a);answers.appendChild(b)})}function pick(a){document.querySelectorAll(".answer").forEach(x=>x.disabled=true);let ok=a===qs[i][1];if(ok){s++;score.textContent=s}msg.textContent=ok?"✅ ¡Correcto!":"❌ Correcta: "+qs[i][1];setTimeout(()=>{msg.textContent="";i++;i<qs.length?show():end()},1000)}function end(){q.textContent="🏆 ¡Misión terminada! Obtuviste "+s+" de 10 puntos.";answers.innerHTML="";restart.classList.remove("hidden")}restart.onclick=()=>{i=0;s=0;score.textContent=0;restart.classList.add("hidden");show()};show();</script></body></html>
