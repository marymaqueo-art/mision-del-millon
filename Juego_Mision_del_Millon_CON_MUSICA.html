<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión del Millón</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#17324d}.w{max-width:950px;margin:auto;padding:16px}.box{background:#fff;border:4px solid #55a9e8;border-radius:24px;padding:18px;margin-bottom:12px}h1{text-align:center;color:#e84d67;font-size:42px}.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.p{background:#fff2a8;border-radius:30px;padding:10px 16px;font-weight:bold}.q{text-align:center;font-size:36px;font-weight:bold}.arena{height:430px;position:relative;overflow:hidden;border:4px dashed #78c6ef;border-radius:24px;background:linear-gradient(#dff4ff,#fff7d9)}button.a{position:absolute;width:42%;min-height:72px;padding:10px;border:2px solid #7bbbe3;border-radius:18px;background:white;font-weight:bold;font-size:16px;transition:.6s}.ship{position:absolute;bottom:8px;left:48%;font-size:50px}.f{text-align:center;font-size:19px;font-weight:bold;padding:14px}.end{text-align:center;display:none}.again{position:static!important;width:auto!important;background:#5b7cfa!important;color:#fff;border:0!important;padding:14px 22px!important}.bar{height:14px;background:#dbeafe;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#45b36b}@media(max-width:600px){h1{font-size:30px}.arena{height:520px}button.a{width:82%;left:9%!important}}</style></head>
<body><main class="w"><section class="box"><h1>🚀 MISIÓN DEL MILLÓN 🚀</h1><p style="text-align:center;font-weight:bold">¡Atrapa la respuesta correcta antes de que termine el tiempo!</p><div class="hud"><span class="p" id="l">❤️❤️❤️</span><span class="p" id="s">⭐ 0</span><span class="p" id="r">🔥 0</span><span class="p" id="t">⏱️ 15</span><button class="p" id="music" type="button" style="border:0;cursor:pointer;font-size:16px">🎵 Música: OFF</button></div><div class="bar"><div id="bar"></div></div></section>
<section class="box" id="play"><div style="text-align:center;font-weight:bold" id="level"></div><div class="q" id="q"></div><p style="text-align:center;font-weight:bold" id="ins"></p><div class="arena"><div id="ans"></div><div class="ship" id="ship">🚀</div></div><div class="f" id="fb">👀 Observa, piensa y toca la respuesta correcta.</div></section>
<section class="box end" id="end"><div style="font-size:70px">🏆</div><h2>¡MISIÓN TERMINADA!</h2><h2 id="final"></h2><div id="stars" style="font-size:40px"></div><p id="msg"></p><button class="a again" id="again">🔄 VOLVER A JUGAR</button></section></main>
<script>
const Q=[
['c','428 705','cuatrocientos veintiocho mil setecientos cinco',['cuatrocientos veintiocho mil setecientos cinco','cuarenta y dos mil ochocientos cinco','cuatrocientos veinte mil setecientos cinco']],
['p','trescientos cinco mil dieciocho','305 018',['350 018','305 018','305 180']],
['c','760 240','setecientos sesenta mil doscientos cuarenta',['setecientos seis mil doscientos cuarenta','setecientos sesenta mil doscientos cuarenta','setenta y seis mil veinticuatro']],
['p','novecientos noventa y nueve mil novecientos noventa y nueve','999 999',['999 099','990 999','999 999']],
['c','501 006','quinientos un mil seis',['quinientos diez mil seis','quinientos un mil sesenta','quinientos un mil seis']],
['p','ochocientos cuarenta mil trescientos cincuenta','840 350',['840 305','804 350','840 350']],
['c','246 708','doscientos cuarenta y seis mil setecientos ocho',['doscientos sesenta y cuatro mil setecientos ocho','doscientos cuarenta y seis mil setecientos ocho','doscientos cuarenta y seis mil setenta y ocho']],
['p','setecientos dos mil once','702 011',['702 110','702 011','720 011']],
['c','580 320','quinientos ochenta mil trescientos veinte',['quinientos ochenta mil trescientos veinte','quinientos ocho mil trescientos veinte','quinientos ochenta mil treinta y dos']],
['p','novecientos trece mil cuarenta y cinco','913 045',['913 450','931 045','913 045']]];
let i=0,score=0,lives=3,streak=0,time=15,timer,mover,lock=false;
let audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;
const melody=[261.63,329.63,392.00,523.25,392.00,329.63,293.66,349.23,440.00,587.33,440.00,349.23];
function tone(freq,dur=.18,vol=.035){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle';o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
}
function startMusic(){
  if(musicOn)return; musicOn=true; $('music').textContent='🔊 Música: ON';
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  tone(melody[musicStep++%melody.length],.22,.025);
  musicTimer=setInterval(()=>tone(melody[musicStep++%melody.length],.22,.025),330);
}
function stopMusic(){musicOn=false;clearInterval(musicTimer);musicTimer=null;$('music').textContent='🎵 Música: OFF'}
const $=x=>document.getElementById(x),P=[[4,20],[53,22],[27,58],[7,55],[52,56],[30,32]];
function hud(){$('l').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('s').textContent='⭐ '+score;$('r').textContent='🔥 '+streak;$('bar').style.width=((i+1)/10*100)+'%'}
function move(){document.querySelectorAll('button.a:not(.again)').forEach((b,n)=>{let p=P[(n+i+Math.floor(time/3))%P.length];b.style.left=p[0]+'%';b.style.top=p[1]+'%'})}
function round(){clearInterval(timer);clearInterval(mover);lock=false;time=15;let x=Q[i];$('level').textContent='NIVEL '+(i+1)+' / 10';$('q').textContent=x[1];$('ins').textContent=x[0]=='c'?'🎯 ¡Atrapa cómo se escribe!':'🎯 ¡Atrapa su representación numérica!';$('fb').textContent='👀 Observa, piensa y toca la respuesta correcta.';$('t').textContent='⏱️ '+time;hud();$('ans').innerHTML='';x[3].forEach((v,n)=>{let b=document.createElement('button');b.className='a';b.textContent=v;let p=P[n];b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.onclick=()=>answer(v);$('ans').appendChild(b)});timer=setInterval(()=>{time--;$('t').textContent=(time<=5?'⚠️ ':'⏱️ ')+time;if(time<=0){clearInterval(timer);clearInterval(mover);miss()}},1000);mover=setInterval(move,2100)}
function answer(v){if(lock)return;lock=true;clearInterval(timer);clearInterval(mover);let x=Q[i];if(v==x[2]){let b=time>=10?50:time>=5?25:10;score+=100+b;streak++;tone(659.25,.12,.05);setTimeout(()=>tone(783.99,.16,.05),120);$('ship').textContent='🚀✨';$('fb').textContent='🎉 ¡CORRECTO! +100 puntos + '+b+' de rapidez';setTimeout(next,900)}else{lives--;streak=0;tone(180,.28,.04);$('ship').textContent='💥';$('fb').textContent='❌ La respuesta correcta es: '+x[2];setTimeout(()=>lives<=0?finish():next(),1300)}hud()}
function miss(){if(lock)return;lock=true;lives--;streak=0;$('fb').textContent='⏰ Se acabó el tiempo. Era: '+Q[i][2];hud();setTimeout(()=>lives<=0?finish():next(),1300)}
function next(){i++;$('ship').textContent='🚀';i>=10?finish():round()}function finish(){clearInterval(timer);clearInterval(mover);$('play').style.display='none';$('end').style.display='block';$('final').textContent=score+' PUNTOS';let n=score>=1200?3:score>=700?2:1;$('stars').textContent='⭐'.repeat(n)+'☆'.repeat(3-n);$('msg').textContent=n==3?'¡Excelente! Eres campeón de los números hasta el millón.':n==2?'¡Muy bien! Intenta superar tu puntuación.':'¡Sigue practicando y vuelve a intentarlo!'}
$('music').onclick=()=>musicOn?stopMusic():startMusic();$('again').onclick=()=>{i=0;score=0;lives=3;streak=0;$('end').style.display='none';$('play').style.display='block';round()};round();
</script></body></html>
